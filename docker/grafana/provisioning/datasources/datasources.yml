# Datasources are provisioned on start, so no manual setup after `make dev`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # The dashboards reference this uid explicitly, so a provisioned datasource
    # with a generated uid would leave every panel empty.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        datasourceUid: prometheus
