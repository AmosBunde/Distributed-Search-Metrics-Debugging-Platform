# Dashboards are provisioned from disk, so `make dev` comes up with them
# already there. Importing by hand is a step people skip, and then the platform
# looks like it has no dashboards.
apiVersion: 1

providers:
  - name: search-metrics
    orgId: 1
    folder: Search Metrics
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
