# The dashboard is served as static files, and /api is proxied to the gateway.
#
# Proxying rather than calling the gateway directly from the browser means the
# app only ever sees one origin: no CORS, no base-URL configuration baked into
# the bundle at build time, and the same image works in every environment.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Client-side routing: every unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
