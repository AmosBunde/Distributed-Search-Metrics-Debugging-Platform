# Local development stack.
#
#   make dev     start everything and wait for it to be healthy
#   make health  check it
#   make down    stop it
#
# Every service has a healthcheck and depends on its dependencies being healthy,
# so `docker compose up --wait` converges without manual retries. Values come
# from .env — copy .env.example first.

name: search-metrics

x-restart: &restart
  restart: unless-stopped

services:
  # --- Event stream ---------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    <<: *restart
    container_name: search-metrics-kafka
    ports:
      # 19092 is the host-facing listener; in-cluster clients use kafka:9092.
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: everything that defaults to 3 replicas must come down.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: search-metrics-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: search-metrics-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-search.events}
      KAFKA_TOPIC_RESULTS: ${KAFKA_TOPIC_RESULTS:-search.results}
      KAFKA_TOPIC_ERRORS: ${KAFKA_TOPIC_ERRORS:-search.errors}
      KAFKA_TOPIC_ANOMALIES: ${KAFKA_TOPIC_ANOMALIES:-search.anomalies}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
    volumes:
      - ./scripts/kafka/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/sh", "/create_topics.sh"]
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    <<: *restart
    container_name: search-metrics-kafka-ui
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # --- Storage --------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    <<: *restart
    container_name: search-metrics-clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-search_metrics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-search}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:15-alpine
    <<: *restart
    container_name: search-metrics-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-search_metrics_meta}
      POSTGRES_USER: ${POSTGRES_USER:-search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-search} -d ${POSTGRES_DB:-search_metrics_meta}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: *restart
    container_name: search-metrics-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # --- Observability --------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    <<: *restart
    container_name: search-metrics-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14269/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *restart
    container_name: search-metrics-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    <<: *restart
    container_name: search-metrics-grafana
    depends_on:
      prometheus: { condition: service_healthy }
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Platform services ----------------------------------------------------
  telemetry-collector:
    build:
      context: .
      dockerfile: services/telemetry-collector/Dockerfile
    <<: *restart
    container_name: search-metrics-collector
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${COLLECTOR_PORT:-8001}:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-6000}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-600}

  metrics-engine:
    build:
      context: .
      dockerfile: services/metrics-engine/Dockerfile
    <<: *restart
    container_name: search-metrics-engine
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports:
      - "${METRICS_ENGINE_PORT:-8002}:8002"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-search_metrics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-search}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      ANOMALY_ZSCORE_THRESHOLD: ${ANOMALY_ZSCORE_THRESHOLD:-3.0}
      ANOMALY_BASELINE_WINDOWS: ${ANOMALY_BASELINE_WINDOWS:-30}
      CLICKHOUSE_INSERT_BATCH_SIZE: ${CLICKHOUSE_INSERT_BATCH_SIZE:-1000}
      CLICKHOUSE_INSERT_INTERVAL_SECONDS: ${CLICKHOUSE_INSERT_INTERVAL_SECONDS:-5}

  debug-service:
    build:
      context: .
      dockerfile: services/debug-service/Dockerfile
    <<: *restart
    container_name: search-metrics-debug
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports:
      - "${DEBUG_SERVICE_PORT:-8003}:8003"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-search_metrics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-search}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-search_metrics_meta}
      POSTGRES_USER: ${POSTGRES_USER:-search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    <<: *restart
    container_name: search-metrics-gateway
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-search_metrics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-search}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      REDIS_HOST: redis
      COLLECTOR_URL: http://telemetry-collector:8001
      DEBUG_SERVICE_URL: http://debug-service:8003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

  query-simulator:
    build:
      context: .
      dockerfile: services/query-simulator/Dockerfile
    container_name: search-metrics-simulator
    profiles: ["tools"]        # never starts with `make dev`; run it on demand
    depends_on:
      telemetry-collector: { condition: service_healthy }
    environment:
      COLLECTOR_URL: http://telemetry-collector:8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    <<: *restart
    container_name: search-metrics-dashboard
    depends_on:
      api-gateway: { condition: service_healthy }
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
