{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "search-metrics.serviceAccountName" . }}
  labels:
    {{- include "search-metrics.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # Cloud identity is attached here: IRSA on AWS, workload identity on Azure
  # and GCP. Keeping it in annotations is what lets one chart serve all three.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The platform services call no Kubernetes API, so they get no token.
automountServiceAccountToken: false
{{- end }}
